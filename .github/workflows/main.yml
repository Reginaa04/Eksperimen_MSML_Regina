name: Machine Learning Workflow CI Regina Pasti Berhasil

on:
  push:
    branches: [ main ]

jobs:
  train-and-build-docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install mlflow scikit-learn pandas numpy

    - name: Run MLflow Project (Training)
      run: |
        mlflow run MLProject --env-manager local

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: reginaa04
        password: dckr_pat_dxWp9BtW0beIytM5XFuCgJORUBw

    - name: Build Docker Image via MLflow
      run: |
        # Tembak langsung folder v1_model yang sudah pasti dibuat oleh python tadi!
        mlflow models build-docker -m "v1_model" -n "reginaa04/model-sml:latest" --enable-mlserver

    - name: Push Docker Image to Docker Hub
      run: |
        docker push reginaa04/model-sml:latest

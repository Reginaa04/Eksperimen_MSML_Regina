name: Machine Learning Workflow CI

on:
  push:
    branches: [ main, master ]

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install mlflow scikit-learn pandas numpy matplotlib

    - name: Run MLflow Project Retraining
      run: |
        mlflow run MLProject --no-conda

    - name: Save Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-artifacts
        path: MLProject/

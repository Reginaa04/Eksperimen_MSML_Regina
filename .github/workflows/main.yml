name: Machine Learning Workflow CI Regina Pasti Berhasil

on:
  push:
    branches: [ main ]

jobs:
  train-and-build-docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install mlflow scikit-learn pandas numpy

    - name: Run MLflow Project (Training)
      run: |
        # Menjalankan training MLflow secara lokal
        mlflow run MLProject --env-manager local

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: reginaa04
        password: dckr_pat_dxWp9BtW0beIytM5XFuCgJORUBw

    - name: Build Docker Image via MLflow Official
      run: |
        # MENGGUNAKAN FUNGSI MLFLOW BUILD-DOCKER SESUAI KRITERIA 3 ADVANCE
        # Kita ambil Run ID terakhir dari folder mlruns menggunakan fitur runs:/ resmi MLflow
        LAST_RUN_ID=$(ls -t mlruns/0/ | grep -v 'meta.yaml' | head -n 1)
        mlflow models build-docker -m "runs:/$LAST_RUN_ID/model" -n "reginaa04/model-sml:latest" --enable-mlserver

    - name: Push Docker Image to Docker Hub
      run: |
        docker push reginaa04/model-sml:latest

name: Machine Learning Workflow CI Advance

on:
  push:
    branches: [ main ]

jobs:
  train-and-build-docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install mlflow scikit-learn pandas numpy

    - name: Run MLflow Project (Training)
      run: |
        # Mengganti --no-conda dengan --env-manager local agar kompatibel dengan versi terbaru
        mlflow run MLProject --env-manager local

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image via MLflow
      run: |
        # Membungkus model hasil training (folder 0) menjadi Docker Image
        mlflow models build-docker -m "mlruns/0" -n "Reginaaa04/model-sml:latest" --enable-mlserver

    - name: Push Docker Image to Docker Hub
      run: |
        docker push Reginaaa04/model-sml:latest

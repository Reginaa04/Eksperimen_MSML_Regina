name: Machine Learning Workflow CI Regina Pasti Berhasil

on:
  push:
    branches: [ main ]

jobs:
  train-and-build-docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Dinaikkan ke 3.10 agar script get-pip tidak error

    - name: Install Dependencies
      run: |
        pip install mlflow scikit-learn pandas numpy

    - name: Run MLflow Project (Training)
      run: |
        mlflow run MLProject --env-manager local

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: reginaa04
        password: dckr_pat_dxWp9BtW0beIytM5XFuCgJORUBw

    - name: Build Docker Image via MLflow Official
      run: |
        # Ambil Run ID terbaru dari hasil training
        LAST_RUN_ID=$(ls -t mlruns/0/ | grep -v 'meta.yaml' | head -n 1)
        
        # Buatkan file requirements otomatis agar MLflow build tidak bingung
        echo -e "mlflow\nscikit-learn\npandas\nnumpy" > mlruns/0/$LAST_RUN_ID/artifacts/model/requirements.txt
        
        # Jalankan perintah MLFLOW resmi sesuai kriteria Advance Dicoding
        mlflow models build-docker -m "mlruns/0/$LAST_RUN_ID/artifacts/model" -n "reginaa04/model-sml:latest" --enable-mlserver

    - name: Push Docker Image to Docker Hub
      run: |
        docker push reginaa04/model-sml:latest
